<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dodaj książkę</title>
    <style>
        * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    text-align: center;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: "Segoe UI", Arial, sans-serif;
    background: linear-gradient(135deg, #5a9586, #7db8a8, #a8d8cb);
}

/* Główny panel */
body > div {
    width: 400px;
    height: auto;
    margin: 0;
    padding: 35px 40px;
    border: none;
    border-radius: 20px;
    background: rgba(255, 255, 255, 0.9);
    box-shadow: 0 12px 35px rgba(0, 0, 0, 0.2);
    backdrop-filter: blur(8px);
}

/* Formularz */
form {
    display: flex;
    flex-direction: column;
    gap: 16px;
}

/* Poszczególne pola */
form > div {
    display: flex;
    flex-direction: column;
    gap: 7px;
}

/* Etykiety */
label {
    color: #345c54;
    font-size: 15px;
    font-weight: 600;
}

/* Pola tekstowe */
input {
    width: 100%;
    padding: 11px 13px;
    border: 2px solid #c9e4de;
    border-radius: 9px;
    outline: none;
    background: #f5fbf9;
    color: #263238;
    font-family: inherit;
    font-size: 15px;
    transition: 0.25s ease;
}

input:focus {
    border-color: #6f6aa8;
    background: white;
    box-shadow: 0 0 0 3px rgba(111, 106, 168, 0.15);
}

/* Pola liczbowe */
input[type="number"] {
    appearance: textfield;
}

input[type="number"]::-webkit-inner-spin-button,
input[type="number"]::-webkit-outer-spin-button {
    opacity: 1;
}

/* Przycisk */
button {
    width: 100%;
    margin-top: 5px;
    padding: 12px;
    border: none;
    border-radius: 10px;
    background: #6f6aa8;
    color: white;
    font-family: inherit;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 5px 12px rgba(0, 0, 0, 0.15);
    transition: 0.25s ease;
}

button:hover {
    background: #59548f;
    transform: translateY(-2px);
    box-shadow: 0 8px 18px rgba(0, 0, 0, 0.2);
}

button:active {
    transform: translateY(0);
}

/* Małe ekrany */
@media (max-width: 450px) {
    body > div {
        width: 90%;
        padding: 30px 25px;
    }
}

    </style>
</head>
<body>
    <div>
    <form method="post" action="/add">
        <div>
            <label for="title">Tytuł</label>
            <input type="text" name="title" minlength="15" required>
        </div>
        <div>
            <label for="pupil">Uczeń</label>
            <input type="text" name="pupil" minlength="15" required>
        </div>
        <div>
            <label for="pupil_price">Cena ucznia</label>
            <input type="number" name="pupil_price" min="10" max="50" required>
        </div>
        <button type="submit">Dodaj</button>
    </form>
    </div>
    
</body>
</html>
